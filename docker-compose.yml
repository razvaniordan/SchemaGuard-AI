version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: schemeguard-postgres
    environment:
      POSTGRES_DB: schemeguard_ai
      POSTGRES_USER: schemeguard
      POSTGRES_PASSWORD: schemeguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemeguard -d schemeguard_ai"]
      interval: 5s
      timeout: 5s
      retries: 20

  rule-engine-python:
    build:
      context: ./rule-engine-python
      dockerfile: Dockerfile
    container_name: schemeguard-rule-engine-python
    ports:
      - "8091:8090"
    environment:
      APP_ENV: local
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: schemeguard-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/schemeguard_ai
      SPRING_DATASOURCE_USERNAME: schemeguard
      SPRING_DATASOURCE_PASSWORD: schemeguard

      # Use this in Java when calling the Python rule engine.
      RULE_ENGINE_BASE_URL: http://rule-engine-python:8090
    depends_on:
      postgres:
        condition: service_healthy
      rule-engine-python:
        condition: service_healthy

  etl:
    build:
      context: .
      dockerfile: ./etl/Dockerfile
    container_name: schemeguard-etl
    environment:
      DATABASE_URL: postgresql://schemeguard:schemeguard@postgres:5432/schemeguard_ai
      ETL_BATCH_SIZE: 1000
      ETL_INCREMENTAL_HOURS: 24
      ETL_LOG_LEVEL: INFO
      ETL_LOG_FILE: etl/logs/etl.log
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:20
    container_name: schemeguard-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend

  ml-python:
    build:
      context: ./ml-python
      dockerfile: Dockerfile
    container_name: schemeguard-ml-python
    ports:
      - "8001:8001"
    environment:
      APP_ENV: local
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/docs', timeout=3).read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: