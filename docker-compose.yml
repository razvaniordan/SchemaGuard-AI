version: "3.9"

services:

  mysql:
    image: mysql:8.4
    container_name: schemeguard-mysql
    environment:
      MYSQL_DATABASE: schemeguard_ai
      MYSQL_USER: schemeguard
      MYSQL_PASSWORD: schemeguard
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: schemeguard-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/schemeguard_ai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: schemeguard
      SPRING_DATASOURCE_PASSWORD: schemeguard
    depends_on:
      mysql:
        condition: service_healthy
  
  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"

volumes:
  mysql_data: