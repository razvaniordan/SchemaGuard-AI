version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: schemeguard-postgres
    environment:
      POSTGRES_DB: schemeguard_ai
      POSTGRES_USER: schemeguard
      POSTGRES_PASSWORD: schemeguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schemeguard -d schemeguard_ai"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: schemeguard-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/schemeguard_ai
      SPRING_DATASOURCE_USERNAME: schemeguard
      SPRING_DATASOURCE_PASSWORD: schemeguard
    depends_on:
      postgres:
        condition: service_healthy
  
  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"

volumes:
  postgres_data: