stages:
  - install
  - test
  - build

# =====================
# FRONTEND
# =====================

frontend_install:
  stage: install
  image: node:20
  script:
    - cd frontend
    - npm install

frontend_test:
  stage: test
  image: node:20
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run typecheck
    - npm run test:run

frontend_build:
  stage: build
  image: node:20
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build

# =====================
# BACKEND
# =====================

backend_test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: schemeguard_ai
    POSTGRES_USER: schemeguard
    POSTGRES_PASSWORD: schemeguard
    SPRING_PROFILES_ACTIVE: postgres
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/schemeguard_ai
    SPRING_DATASOURCE_USERNAME: schemeguard
    SPRING_DATASOURCE_PASSWORD: schemeguard
  script:
    - cd backend
    - mvn test

backend_build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - cd backend
    - mvn clean package