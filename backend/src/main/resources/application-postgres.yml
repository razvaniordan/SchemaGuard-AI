spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/schemeguard_ai
    username: schemeguard
    password: schemeguard
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info